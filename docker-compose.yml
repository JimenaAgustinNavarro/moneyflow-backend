services:
  postgres:
    image: postgres:16-alpine
    container_name: moneyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moneyflow_dev}
      TZ: America/Lima
      PGTZ: America/Lima
    command:
      - postgres
      - -c
      - timezone=America/Lima
    ports:
      - "5432:5432"
    volumes:
      - moneyflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moneyflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: moneyflow-mailpit
    restart: unless-stopped
    environment:
      TZ: America/Lima
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8025/livez || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  moneyflow_pgdata:
    name: moneyflow_pgdata
